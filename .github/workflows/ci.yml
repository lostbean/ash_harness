name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-default:
    runs-on: ubuntu-latest
    name: Test (default / ETS)
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      # Type-check gate. Replaces the former Dialyzer pass: Elixir 1.20's
      # built-in set-theoretic type checker runs during compilation, so a
      # forced warnings-as-errors compile is the type gate. `--force`
      # recompiles every module even on a deps/_build cache hit, so the
      # checker re-examines the whole tree.
      - name: Type-check (compile --warnings-as-errors)
        run: mix compile --warnings-as-errors --force
      - run: mix test
      - run: mix credo --strict

  test-postgres:
    runs-on: ubuntu-latest
    name: Test (Postgres)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ash_harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"
      - run: mix deps.get
      # Until Phase 8 adds :postgres-tagged tests, the job's value is
      # exercising the MIX_ENV=postgres compile path against the live PG
      # service. `mix test --only postgres` exits 1 when zero tests match
      # (Mix design), so capture output and tolerate that one case.
      - name: Compile against postgres env
        # Plain `mix compile` (not --warnings-as-errors). The :postgres
        # env triggers dev-only optional deps (Igniter, Owl) and excludes
        # :test-only ones (Plug for LLMStub), so warnings-as-errors here
        # would only fire on those benign edges. The :test job runs
        # warnings-as-errors and is the gate.
        run: MIX_ENV=postgres mix compile
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: postgres
      - name: Run postgres-tagged tests (tolerate zero matches)
        run: |
          set -o pipefail
          output=$(MIX_ENV=postgres mix test --only postgres 2>&1) || \
            grep -q 'no test was executed' <<< "$output"
          echo "$output"
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: postgres

  test-integration:
    runs-on: ubuntu-latest
    name: Test (integration / real LLM, nightly)
    if: github.event.schedule || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"
      - run: mix deps.get
      - run: MIX_ENV=integration mix test --only integration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
